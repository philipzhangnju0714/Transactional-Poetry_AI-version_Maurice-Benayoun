# Publishes the site on GitHub Pages:
#   /            the poetry pages (public/), live VOV data, grammar poems
#   /exhibition/ the v0.1.0 exhibition player, videos and stills
name: Pages

on:
  push:
    branches: [main, claude/nice-maxwell-8516ue]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp -r docs/exhibition-v0.1.0 _site/exhibition
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
