  :root {
    color-scheme: dark;
    --bg: #000; --ink: #f3f4f6; --ink-2: #9ca3af; --ink-3: #5b616b; --accent: #ff3c00; --ai: #b9a7ff;
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); overflow: hidden; }
  body { display: grid; grid-template-rows: 1fr; }
  body.idle { cursor: none; }
  .lang { position: fixed; top: 2.5vh; right: 2.5vw; display: flex; gap: 4px; transition: opacity .6s ease; z-index: 2; }
  .lang button { font: inherit; font-size: 12px; letter-spacing: .12em; color: var(--ink-3); background: transparent;
    border: 1px solid #2a2e35; border-radius: 999px; padding: .35em .9em; cursor: pointer; }
  .lang button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-2); }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body.idle .lang, body.idle .hint { opacity: 0; }

  .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; padding: 6vh 6vw 2vh; text-align: center; }
  .poem {
    margin: 0; max-width: 88vw; font-family: var(--display); font-weight: 400; text-transform: uppercase;
    font-size: min(5.6vw, 10.5vh); line-height: 1.12; text-wrap: balance; transition: opacity .7s ease;
  }
  .poem .value { color: var(--accent); }
  .fade { opacity: 0; }
  .caption { display: flex; gap: 1.6vw; align-items: center; justify-content: center; flex-wrap: wrap;
    font-size: max(12px, 1.6vh); color: var(--ink-2); letter-spacing: .02em; transition: opacity .7s ease; }
  .tag { border: 1px solid #2a2e35; border-radius: 999px; padding: .25em .9em; font-size: .85em; letter-spacing: .1em; text-transform: uppercase; }
  .hint { position: fixed; left: 50%; top: 2.5vh; transform: translateX(-50%); font-size: 12px; color: var(--ink-3); transition: opacity 1s ease; white-space: nowrap; }

  /* cards used for the video */
  .card { display: none; }
  body.card-mode .screen > :not(.card) { display: none; }
  body.card-mode .card.on { display: flex; }
  .card { flex-direction: column; align-items: center; gap: 3.2vh; }
  .card h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 9vh; line-height: 1; letter-spacing: .01em; }
  .card h1 em { font-style: normal; color: var(--accent); }
  .card p { margin: 0; font-size: 2.1vh; color: var(--ink-2); max-width: 70vw; line-height: 1.6; }
  .compare { display: grid; grid-template-columns: auto 1fr; gap: 3vh 3vw; align-items: baseline; text-align: left; max-width: 80vw; }
  .compare .label { font-size: 1.8vh; letter-spacing: .14em; color: var(--ink-2); text-transform: uppercase; white-space: nowrap; }
  .compare .line { font-family: var(--display); font-size: 4.4vh; line-height: 1.15; text-transform: uppercase; }
  .compare .line .value { color: var(--accent); }
  .compare .trade { font-size: 2.4vh; color: var(--ink); }
  .compare .ai-label { color: var(--ai); }
</style>

const UI = {
  en: { hint: "click or F: full screen · ← → · space: pause · G: AI / grammar · L: language", grammar: "artist's grammar" },
  it: { hint: "clic o F: schermo intero · ← → · spazio: pausa · G: IA / grammatica · L: lingua", grammar: "grammatica dell'artista" },
};
const VERSION = "v0.1.0";
const poems = DATA.poems;
const params = new URLSearchParams(location.search);
const INTERVAL = 1000 * (Number(params.get("interval")) || 8);
const $ = (id) => document.getElementById(id);

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const toHtml = (text) => text.split(/\s*#\s*/).map((line) =>
  esc(line).replace(/(?<!\p{L})\p{Lu}{2,}(?!\p{L})/gu, (w) => `<span class="value">${w}</span>`)).join("<br>");

// No trade line under the poem. The grammar version (G key) is marked, since it is not the default.
const captionFor = (m) => (m === "ai" ? "" : `<span class="tag">${esc(UI[lang].grammar)}</span>`);

let lang = params.get("lang") === "it" ? "it" : params.get("lang") === "en" ? "en" : null;
try { lang ??= localStorage.getItem("tp-lang"); } catch {}
if (lang !== "it") lang = "en";
const textOf = (p, m) => (p.live ? p.live[lang] : lang === "it" ? IT.poems[p.tx.vov][m] : p[m]);

// ---- live: the first poem is always the newest real trade on the VOV market ----
// One request on load (the Trading History feed of vov.art/dashboard-one), then a light check every 5 minutes.
// A trade from the snapshot keeps its AI poem; a newer one gets a poem from the bilingual templates.
const TRADES = "https://api.v-o-v.io/api/v1/chart/trading-history/";
const slotsOf = (t) => [...new Set(t.match(/\{[A-D]\}/g))].sort();
const fillIn = (t, names) => { const order = slotsOf(t); return t.replace(/\{[A-D]\}/g, (s) => names[order.indexOf(s)]); };
function seeded(seed) {
  let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ 0x9e3779b9) >>> 0) / 4294967296;
}
function livePoem(tx, before) {
  const rand = seeded(tx.id);
  const r = rand(), want = r < 0.25 ? 1 : r < 0.75 ? 2 : r < 0.95 ? 3 : 4;
  const values = [tx.value];
  for (const t of before) { if (values.length >= want) break; if (!values.includes(t.value)) values.push(t.value); }
  const size = Math.max(...IT.liveTemplates.map((t) => slotsOf(t.en).length).filter((n) => n <= values.length));
  const pool = IT.liveTemplates.filter((t) => slotsOf(t.en).length === size);
  const tpl = pool[Math.floor(rand() * pool.length)];
  return { tx, live: { en: fillIn(tpl.en, values), it: fillIn(tpl.it, values.map((v) => IT.values[v] || v)) } };
}
let newestId = null;
async function refreshLive() {
  try {
    const res = await fetch(TRADES, { cache: "no-store" });
    if (!res.ok) return;
    const trades = ((await res.json()).vovs || [])
      .filter((t) => t.vov)
      .map((t) => ({ vov: t.vov, date: t.date, id: `${t.vov}@${t.date}`, value: t.vov.replace(/\d+$/, "").toUpperCase() }))
      .sort((a, b) => (a.date < b.date ? 1 : -1));
    const tx = trades[0];
    if (!tx || tx.id === newestId) return;
    const first = newestId === null;
    newestId = tx.id;
    const k = poems.findIndex((p) => p.tx.vov === tx.vov && p.tx.date === tx.date);
    poems.unshift(k >= 0 ? poems.splice(k, 1)[0] : livePoem(tx, trades.slice(1)));
    i = 0;
    show(0, !first);
    schedule();
  } catch {
    // offline: the snapshot poems keep playing
  }
}

let i = 0, mode = params.get("mode") === "grammar" ? "grammar" : "ai", timer = null, paused = false;

function draw(index, m = mode) {
  const p = poems[index];
  $("poem").innerHTML = toHtml(textOf(p, m));
  $("caption").innerHTML = captionFor(m);
}
function show(index, animate = true) {
  if (!animate) return draw(index);
  $("poem").classList.add("fade"); $("caption").classList.add("fade");
  setTimeout(() => { draw(index); $("poem").classList.remove("fade"); $("caption").classList.remove("fade"); }, 700);
}
function schedule() { clearTimeout(timer); if (!paused) timer = setTimeout(() => { i = (i + 1) % poems.length; show(i); schedule(); }, INTERVAL); }

// ---- rendering hooks for the video (render-video.mjs) ----
window.__render = {
  count: poems.length,
  poem(index, m) { document.body.classList.remove("card-mode"); draw(index, m); },
  card(name) {
    document.body.classList.add("card-mode");
    document.querySelectorAll(".card").forEach((c) => c.classList.toggle("on", c.id === `card-${name}`));
  },
};

// The comparison card: one trade, the 2019 grammar line and the AI line.
(() => {
  const p = poems[0];
  const when = new Date(p.tx.date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  $("compare").innerHTML = `
    <span class="label">trade</span><span class="trade">${esc(p.tx.vov)} offered for $${esc(p.tx.price.replace(/\.00$/, ""))} · ${esc(p.tx.location || "")} · ${when}</span>
    <span class="label">artist's grammar</span><span class="line">${toHtml(p.grammar)}</span>
    <span class="label ai-label">AI version</span><span class="line">${toHtml(p.ai)}</span>`;
  $("end-note").textContent = `Prototype ${VERSION} · ${poems.length} real trades from the Value of Values market · AI poems written within the artist's grammar`;
})();

function setLang(l, animate = true) {
  lang = l;
  try { localStorage.setItem("tp-lang", l); } catch {}
  document.documentElement.lang = l;
  $("hint").textContent = UI[l].hint;
  document.querySelectorAll("#lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  if (!params.has("render")) show(i, animate);
}

if (params.has("render")) {
  document.getElementById("hint").remove();
  document.getElementById("lang").remove();
} else {
  setLang(lang, false);
  // Controls show while the mouse moves, then fade with the cursor.
  let idleTimer = null;
  const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add("idle"), 3000); };
  ["mousemove", "pointerdown", "keydown"].forEach((ev) => addEventListener(ev, wake));
  wake();
  $("lang").addEventListener("click", (e) => {
    e.stopPropagation(); // a language click is not a full-screen click
    const b = e.target.closest("button");
    if (b && b.dataset.lang !== lang) setLang(b.dataset.lang);
  });
  show(0, false);
  schedule();
  refreshLive();
  setInterval(refreshLive, 5 * 60 * 1000);
  setTimeout(() => ($("hint").style.opacity = 0), 6000);
  const step = (d) => { i = (i + d + poems.length) % poems.length; show(i); schedule(); };
  const full = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.())?.catch?.(() => {});
  addEventListener("click", full);
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "arrowright") step(1);
    else if (k === "arrowleft") step(-1);
    else if (k === " ") { e.preventDefault(); paused = !paused; schedule(); }
    else if (k === "g") { mode = mode === "ai" ? "grammar" : "ai"; show(i); }
    else if (k === "l") setLang(lang === "en" ? "it" : "en");
    else if (k === "f") full();
  });
}
